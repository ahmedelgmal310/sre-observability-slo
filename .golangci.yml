version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests use plain http.Get/Post and table-driven fixtures.
      - path: _test\.go
        linters: [noctx, gosec, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ahmedelgmal310/sre-observability-slo
