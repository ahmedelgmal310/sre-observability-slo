# Lighthouse: three Go services plus a full OpenTelemetry/Grafana stack.
#   docker compose up -d --build --wait
#   open http://localhost:3000  (Grafana, anonymous viewer)
# Every image is pinned by digest; the full list is in docs/versions.md.
name: lighthouse

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-service-env: &service-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  # Lets clients inject faults through W3C baggage. Demo/test environments only.
  CHAOS_ENABLED: "true"
  LOG_LEVEL: info

x-service-health: &service-health
  test: ["CMD", "/service", "-healthcheck"]
  interval: 5s
  timeout: 3s
  start_period: 5s
  retries: 10

services:
  gateway:
    <<: *hardening
    image: lighthouse/gateway:local
    build: {context: ., args: {SERVICE: gateway}}
    environment:
      <<: *service-env
      ORDERS_URL: http://orders:8080
    ports: ["127.0.0.1:8080:8080"]
    healthcheck: *service-health
    depends_on:
      orders: {condition: service_healthy}
      otel-collector: {condition: service_started}

  orders:
    <<: *hardening
    image: lighthouse/orders:local
    build: {context: ., args: {SERVICE: orders}}
    environment:
      <<: *service-env
      INVENTORY_URL: http://inventory:8080
    healthcheck: *service-health
    depends_on:
      inventory: {condition: service_healthy}
      otel-collector: {condition: service_started}

  inventory:
    <<: *hardening
    image: lighthouse/inventory:local
    build: {context: ., args: {SERVICE: inventory}}
    environment:
      <<: *service-env
    healthcheck: *service-health
    depends_on:
      otel-collector: {condition: service_started}

  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports: ["127.0.0.1:4318:4318"]
    depends_on: [tempo, loki]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    tmpfs: ["/prometheus:mode=1777"]
    ports: ["127.0.0.1:9090:9090"]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    tmpfs: ["/alertmanager:mode=1777"]
    ports: ["127.0.0.1:9093:9093"]

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    tmpfs: ["/var/tempo:mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    ports: ["127.0.0.1:3200:3200"]

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    tmpfs: ["/loki:mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/gateway-slo.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Use the plugin versions bundled in the pinned image; never download or
      # auto-update plugins at startup.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs: ["/var/lib/grafana:mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo, loki]

  # Load generator, only started on demand:
  #   docker compose run --rm k6 run /scripts/baseline.js
  k6:
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    profiles: [load]
    environment:
      BASE_URL: http://gateway:8080
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/results:/results
    depends_on:
      gateway: {condition: service_healthy}
